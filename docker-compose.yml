version: "2"
services:
  wapi:
    build: .
    depends_on:
      - mongo
    volumes:
      - .:/usr/app/
      - /usr/app/node_modules
    ports:
      - "3001:3001"
    command: npm run start
 
  mongo:
    image: "mongo:4.2.2-bionic"
    restart: always
    volumes:
      - ./data:/data/db
    ports:
      - "27017:27017"

  varnish:
    image: "varnish:6.0.5"
    ports:
      - "6060:80"
    depends_on:
      - wapi
    links: 
      - wapi
    volumes:
      - ./default.vcl:/etc/varnish/default.vcl
    restart: unless-stopped

